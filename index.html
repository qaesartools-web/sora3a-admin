<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إدارة سرعة">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>سرعة — الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --panel:#161922; --panel2:#1d2230; --line:#262b38;
  --text:#e8eaf0; --muted:#8a93a6; --accent:#ff6b3d; --accent2:#ffb84d;
  --green:#2ecc71; --red:#ff4757; --blue:#4dabf7; --yellow:#ffc83d; --purple:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 30%,rgba(255,107,61,.2),transparent 60%),
             radial-gradient(ellipse at 70% 70%,rgba(255,184,77,.15),transparent 60%),#0f1115;
  transition:opacity .6s;}
#splash.hide{opacity:0;pointer-events:none;}
.sp-ring{width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,107,61,.3);display:flex;align-items:center;justify-content:center;animation:spRing 2s ease-in-out infinite;margin-bottom:24px;position:relative;}
.sp-ring::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,184,77,.2);animation:spRing 2s ease-in-out infinite reverse;}
.sp-logo{width:80px;height:80px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 40px rgba(255,107,61,.4);}
@keyframes spRing{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.sp-title{font-size:38px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:fadeUp .8s ease both;}
.sp-sub{font-size:14px;color:var(--muted);margin-top:6px;animation:fadeUp .8s ease .2s both;}
.sp-bar{width:200px;height:3px;background:rgba(255,107,61,.2);border-radius:3px;margin-top:32px;overflow:hidden;animation:fadeUp .8s ease .4s both;}
.sp-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;animation:spFill 2s ease forwards;}
@keyframes spFill{from{width:0;}to{width:100%;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* ── LOGIN ── */
#loginPage{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 20% 50%,rgba(255,107,61,.1),transparent 55%),
             radial-gradient(ellipse at 80% 50%,rgba(255,184,77,.07),transparent 55%);}
.lbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 40px 100px rgba(0,0,0,.6);}
.l-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;box-shadow:0 8px 30px rgba(255,107,61,.4);}
.l-title{text-align:center;font-size:24px;font-weight:900;margin-bottom:4px;}
.l-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
.l-badge{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--green);margin-bottom:20px;}
.l-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.l-inp{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:border-color .2s;margin-bottom:10px;}
.l-inp:focus{border-color:var(--accent);}
.l-err{background:rgba(255,71,87,.1);border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:10px;display:none;}
.l-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(255,107,61,.35);}
.l-hint{text-align:center;color:var(--muted);font-size:11px;margin-top:12px;}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── APP ── */
#appPage{display:none;}

/* Header */
.hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.3);}
.hdr-logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr-user{display:flex;align-items:center;gap:10px;}
.hdr-name{font-size:12px;color:var(--muted);}
.hdr-role{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.role-admin{background:rgba(255,107,61,.2);color:var(--accent);}
.role-rest{background:rgba(77,171,247,.2);color:var(--blue);}
.logout-btn{background:transparent;border:1px solid var(--line);color:var(--red);padding:5px 12px;border-radius:8px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:11px;}

/* Desktop Nav */
.dnav{background:var(--panel2);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 16px;}
.dnav::-webkit-scrollbar{height:0;}
.dnav-btn{flex-shrink:0;padding:13px 18px;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;}
.dnav-btn.on{color:var(--accent);border-bottom-color:var(--accent);}
.dnav-btn:hover{color:var(--text);}

/* Mobile Nav */
.mnav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
@media(min-width:900px){.mnav{display:none;}}
.mnav-btn{flex:1;padding:9px 4px;background:transparent;border:none;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.mnav-btn.on{color:var(--accent);}
.mnav-icon{font-size:18px;}

/* Main content */
.main{padding:16px;max-width:1200px;margin:0 auto;padding-bottom:80px;}
@media(min-width:900px){.main{padding-bottom:20px;}}

/* Screen */
.screen{display:none;}
.screen.on{display:block;}

/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
.card-title{font-size:14px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr);}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;transition:all .2s;}
.stat:hover{border-color:var(--accent);transform:translateY(-2px);}
.stat-v{font-size:24px;font-weight:900;color:var(--accent);}
.stat-l{font-size:11px;color:var(--muted);margin-top:4px;}

/* Form */
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700;}
.form-inp{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.form-inp:focus{border-color:var(--accent);}
.form-sel{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;outline:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.form-row{grid-template-columns:1fr;}}
.btn-primary{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* Entity cards */
.entity{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:all .2s;}
.entity:hover{border-color:rgba(255,107,61,.3);}
.entity-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.entity-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(255,107,61,.2),rgba(255,184,77,.2));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.entity-name{font-size:14px;font-weight:900;}
.entity-sub{font-size:11px;color:var(--muted);}
.entity-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px;}
.meta-item{background:var(--panel);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted);}
.meta-item strong{color:var(--text);display:block;}
.entity-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn-sm{padding:6px 12px;border-radius:8px;border:none;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-edit{background:rgba(77,171,247,.15);color:var(--blue);}
.btn-edit:hover{background:rgba(77,171,247,.3);}
.btn-del{background:rgba(255,71,87,.15);color:var(--red);}
.btn-del:hover{background:rgba(255,71,87,.3);}
.btn-cap{background:rgba(255,107,61,.15);color:var(--accent);}
.btn-cap:hover{background:rgba(255,107,61,.3);}

/* Captain stats */
.cap-stat-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.cap-stat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cap-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cap-stats-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cap-stat-item{background:var(--panel);border-radius:8px;padding:8px;text-align:center;}
.cap-stat-v{font-size:16px;font-weight:900;color:var(--accent);}
.cap-stat-l{font-size:10px;color:var(--muted);}

/* Orders list */
.order-row{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;transition:all .2s;}
.order-row:hover{border-color:rgba(255,107,61,.3);}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.order-id{font-weight:900;font-size:13px;font-family:monospace;}
.order-time{font-size:11px;color:var(--muted);}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;}
.b-pending{background:rgba(255,200,61,.15);color:#ffc83d;}
.b-accepted{background:rgba(77,171,247,.15);color:var(--blue);}
.b-delivering{background:rgba(255,184,77,.15);color:#ffb84d;}
.b-delivered{background:rgba(46,204,113,.15);color:var(--green);}
.b-cancelled{background:rgba(255,71,87,.15);color:var(--red);}
.b-salon{background:rgba(168,85,247,.15);color:var(--purple);}
.b-takeaway{background:rgba(255,200,61,.15);color:#ffc83d;}

/* Filters */
.filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
.filter-row::-webkit-scrollbar{height:0;}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}
.filter-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* Date filter */
.date-filter{display:flex;gap:8px;margin-bottom:12px;}
.date-filter input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:12px;outline:none;}
.date-filter button{padding:7px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-ov.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:900;margin-bottom:16px;}
.modal-btns{display:flex;gap:8px;margin-top:16px;}
.modal-btns .btn-save{flex:2;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.modal-btns .btn-cancel{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer;}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--panel);border:1px solid var(--green);color:var(--green);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:700;z-index:9999;transition:transform .3s;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);}

/* Restaurant mode banner */
.rest-banner{background:linear-gradient(135deg,rgba(77,171,247,.1),rgba(77,171,247,.05));border:1px solid rgba(77,171,247,.3);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px;font-weight:700;color:var(--blue);text-align:center;display:none;}
body.rest-mode .rest-banner{display:block;}
body.rest-mode .admin-only{display:none!important;}

/* Install btn */
#installBtn{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;border-radius:20px;padding:8px 18px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;z-index:7000;box-shadow:0 4px 20px rgba(255,107,61,.5);}

/* Scrollbar */
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-ring"><div class="sp-logo">📊</div></div>
  <div class="sp-title">سرعة</div>
  <div class="sp-sub">لوحة الإدارة المتقدمة</div>
  <div class="sp-bar"><div class="sp-bar-fill"></div></div>
</div>

<button id="installBtn" onclick="doInstall()">📲 تثبيت التطبيق</button>

<!-- LOGIN -->
<div id="loginPage">
  <div class="lbox">
    <div class="l-icon">📊</div>
    <div class="l-title">منصة سرعة</div>
    <div class="l-sub">لوحة الإدارة المتقدمة</div>
    <div class="l-badge"><span class="l-dot"></span> متصل بـ Firebase</div>
    <div class="l-err" id="lErr"></div>
    <div class="form-group"><label>البريد الإلكتروني</label><input class="l-inp" id="lEmail" type="email" placeholder="admin@sora3a.com" autocomplete="email"></div>
    <div class="form-group"><label>كلمة المرور</label><input class="l-inp" id="lPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="l-btn" id="lBtn" onclick="doLogin()">🔐 دخول</button>
    <div class="l-hint">الإدارة العليا والمطاعم فقط</div>
  </div>
</div>

<!-- APP -->
<div id="appPage">
  <div class="hdr">
    <div class="hdr-logo">🚀 سرعة</div>
    <div class="hdr-user">
      <div>
        <div class="hdr-name" id="hdrName">—</div>
        <span class="hdr-role" id="hdrRole">—</span>
      </div>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <!-- Desktop Nav -->
  <div class="dnav" id="dNav"></div>

  <div class="main">
    <!-- Dashboard -->
    <div class="screen on" id="scDash">
      <div class="rest-banner" id="restBanner">🍽️ أنت تشوف بيانات مطعمك فقط</div>
      <div class="stats" id="dashStats"></div>
      <div class="card">
        <div class="card-title"><span class="dot"></span> آخر الطلبات</div>
        <div id="dashOrders"></div>
      </div>
    </div>

    <!-- Orders -->
    <div class="screen" id="scOrders">
      <div class="filter-row" id="ordersFilter">
        <button class="filter-btn on" onclick="setOF('all',this)">📋 الكل</button>
        <button class="filter-btn" onclick="setOF('delivery',this)">🏍️ دلفري</button>
        <button class="filter-btn" onclick="setOF('salon',this)">🪑 صالة</button>
        <button class="filter-btn" onclick="setOF('takeaway',this)">🥡 سفري</button>
        <button class="filter-btn" onclick="setOF('pending',this)">🟡 ينتظر</button>
        <button class="filter-btn" onclick="setOF('delivered',this)">✅ مسلّمة</button>
      </div>
      <div id="ordersList"></div>
    </div>

    <!-- Captains Stats -->
    <div class="screen" id="scCaptains">
      <div class="date-filter">
        <input type="date" id="capFrom">
        <input type="date" id="capTo">
        <button onclick="renderCapStats()">🔍 بحث</button>
      </div>
      <div id="capStatsList"></div>
      <!-- Add Captain Form -->
      <div class="card" id="addCapForm">
        <div class="card-title"><span class="dot"></span> ➕ إضافة كابتن</div>
        <div class="form-group admin-only"><label>المطعم *</label><select class="form-sel" id="ncRest"><option value="">-- اختر --</option></select></div>
        <div class="form-row">
          <div class="form-group"><label>الاسم *</label><input class="form-inp" id="ncName" placeholder="اسم الكابتن"></div>
          <div class="form-group"><label>الهاتف *</label><input class="form-inp" id="ncPhone" placeholder="07xxxxxxxxx" type="tel"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>الإيميل *</label><input class="form-inp" id="ncEmail" type="email" placeholder="captain@sora3a.com"></div>
          <div class="form-group"><label>كلمة المرور *</label><input class="form-inp" id="ncPass" type="password" placeholder="••••••"></div>
        </div>
        <button class="btn-primary" onclick="addCaptain()">➕ إضافة الكابتن</button>
      </div>
    </div>

    <!-- Restaurants -->
    <div class="screen admin-only" id="scRests">
      <!-- Add Restaurant -->
      <div class="card">
        <div class="card-title"><span class="dot"></span> ➕ إضافة مطعم جديد</div>
        <div class="form-row">
          <div class="form-group"><label>اسم المطعم *</label><input class="form-inp" id="nrName" placeholder="اسم المطعم"></div>
          <div class="form-group"><label>المنطقة *</label><input class="form-inp" id="nrArea" placeholder="الحسينية..."></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>الإيميل *</label><input class="form-inp" id="nrEmail" type="email" placeholder="rest@sora3a.com"></div>
          <div class="form-group"><label>الهاتف</label><input class="form-inp" id="nrPhone" type="tel" placeholder="07xxxxxxxxx"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>كلمة المرور *</label><input class="form-inp" id="nrPass" type="password" placeholder="••••••"></div>
          <div class="form-group"><label>الاشتراك (د.ع/شهر)</label><input class="form-inp" id="nrSub" type="number" placeholder="50000" value="50000"></div>
        </div>
        <button class="btn-primary" id="addRestBtn" onclick="addRestaurant()">➕ إضافة المطعم</button>
      </div>

<script>
'use strict';

let currentUser=null, restData=null;
let allOrders=[], allCaptains=[], allRestaurants=[];
let unsubs=[], orderFilter='all', installPrompt=null, toastT;

const fmt=n=>Number(n||0).toLocaleString('ar-IQ');
const toA=n=>n.toString().replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const isAdmin=()=>currentUser?.role==='admin';
const isRest=()=>currentUser?.role==='restaurant';

function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=type==='error'?'var(--red)':type==='warn'?'var(--yellow)':'var(--green)';
  t.style.color=type==='error'?'var(--red)':type==='warn'?'var(--yellow)':'var(--green)';
  t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000);
}

// PWA
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();installPrompt=e;
  document.getElementById('installBtn').style.display='block';
});
window.doInstall=()=>{if(!installPrompt)return;installPrompt.prompt();installPrompt.userChoice.then(()=>{document.getElementById('installBtn').style.display='none';installPrompt=null;});};

// SPLASH
let splashDone=false;
function hideSplash(){
  if(splashDone)return;splashDone=true;
  const sp=document.getElementById('splash');
  sp.classList.add('hide');
  setTimeout(()=>sp.style.display='none',600);
}
setTimeout(hideSplash,2800);

// AUTH
window.addEventListener('fbReady',()=>{
  const fb=window._fb;
  fb.onAuthStateChanged(fb.auth,async user=>{
    hideSplash();
    if(user){
      try{
        // Check users collection
        const udoc=await fb.getDoc(fb.doc(fb.db,'users',user.uid));
        if(!udoc.exists()){await fb.signOut(fb.auth);return;}
        const ud=udoc.data();
        if(ud.role!=='admin'&&ud.role!=='restaurant'){
          await fb.signOut(fb.auth);
          showErr('❌ هذا الحساب غير مصرح له');return;
        }
        currentUser={uid:user.uid,email:user.email,...ud};
        if(ud.role==='restaurant'){
          // Find restaurant by email first, then userId
          let rs=await fb.getDocs(fb.query(fb.collection(fb.db,'restaurants'),fb.where('email','==',user.email)));
          if(rs.empty) rs=await fb.getDocs(fb.query(fb.collection(fb.db,'restaurants'),fb.where('userId','==',user.uid)));
          if(rs.empty){await fb.signOut(fb.auth);showErr('❌ هذا الحساب غير مرتبط بمطعم');return;}
          restData={id:rs.docs[0].id,...rs.docs[0].data()};
          currentUser.restaurantId=restData.id;
          currentUser.restaurantName=restData.name;
          // Update userId if changed
          if(restData.userId!==user.uid) fb.updateDoc(fb.doc(fb.db,'restaurants',restData.id),{userId:user.uid}).catch(()=>{});
        }
        enterApp();
      }catch(e){console.error(e);await fb.signOut(fb.auth);}
    }else{
      currentUser=null;restData=null;
      unsubs.forEach(u=>u&&u());unsubs=[];
      document.getElementById('loginPage').style.display='flex';
      document.getElementById('appPage').style.display='none';
      document.body.classList.remove('rest-mode');
      resetLoginBtn();
    }
  });
  document.getElementById('lPass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
});

function showErr(msg){
  const el=document.getElementById('lErr');
  el.textContent=msg;el.style.display='block';
  resetLoginBtn();
}
function resetLoginBtn(){
  const btn=document.getElementById('lBtn');
  btn.innerHTML='🔐 دخول';btn.disabled=false;
}

window.doLogin=async()=>{
  const email=document.getElementById('lEmail').value.trim().toLowerCase();
  const pass=document.getElementById('lPass').value;
  const btn=document.getElementById('lBtn');
  document.getElementById('lErr').style.display='none';
  if(!email||!pass){showErr('أدخل الإيميل وكلمة المرور');return;}
  btn.innerHTML='<div class="spin"></div>';btn.disabled=true;
  try{
    await window._fb.signInWithEmailAndPassword(window._fb.auth,email,pass);
  }catch(e){
    let msg=e.message;
    if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(e.code))msg='❌ بيانات الدخول غير صحيحة';
    else if(e.code==='auth/too-many-requests')msg='⚠️ محاولات كثيرة، انتظر';
    showErr(msg);
  }
};

window.doLogout=async()=>{
  if(!confirm('تسجيل الخروج؟'))return;
  unsubs.forEach(u=>u&&u());unsubs=[];
  await window._fb.signOut(window._fb.auth);
};

// ENTER APP
function enterApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appPage').style.display='block';
  document.getElementById('hdrName').textContent=currentUser.restaurantName||currentUser.email;
  document.getElementById('hdrRole').className='hdr-role '+(isAdmin()?'role-admin':'role-rest');
  document.getElementById('hdrRole').textContent=isAdmin()?'👑 إدارة عليا':'🍽️ مطعم';
  if(isRest()) document.body.classList.add('rest-mode');
  buildNavs();
  startListeners();
}

// NAVS
const tabs=[
  {id:'dash',label:'الرئيسية',icon:'🏠',screen:'scDash',adminOnly:false},
  {id:'orders',label:'الطلبات',icon:'📋',screen:'scOrders',adminOnly:false},
  {id:'captains',label:'الكباتن',icon:'🛵',screen:'scCaptains',adminOnly:false},
  {id:'rests',label:'المطاعم',icon:'🍽️',screen:'scRests',adminOnly:true},
  {id:'map',label:'الخريطة',icon:'🗺️',screen:'scMap',adminOnly:false},
  {id:'analytics',label:'التحليلات',icon:'📊',screen:'scAnalytics',adminOnly:false},
];

function buildNavs(){
  const visibleTabs=tabs.filter(t=>!t.adminOnly||isAdmin());
  document.getElementById('dNav').innerHTML=visibleTabs.map((t,i)=>
    `<button class="dnav-btn ${i===0?'on':''}" data-screen="${t.screen}" onclick="goTab('${t.screen}',this)">${t.icon} ${t.label}</button>`
  ).join('');
  document.getElementById('mNav').innerHTML=visibleTabs.map((t,i)=>
    `<button class="mnav-btn ${i===0?'on':''}" data-screen="${t.screen}" onclick="goTab('${t.screen}',this)"><div class="mnav-icon">${t.icon}</div><div>${t.label}</div></button>`
  ).join('');
}

window.goTab=function(screenId,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(screenId).classList.add('on');
  document.querySelectorAll('.dnav-btn,.mnav-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll(`[data-screen="${screenId}"]`).forEach(b=>b.classList.add('on'));
  if(screenId==='scCaptains')renderCapStats();
  if(screenId==='scMap')initMap();
  if(screenId==='scAnalytics')renderAnalytics();
  if(screenId==='scRests')renderRests();
};

// LISTENERS
function startListeners(){
  const fb=window._fb;
  const ordersQ=isRest()
    ? fb.query(fb.collection(fb.db,'orders'),fb.where('restaurantId','==',currentUser.restaurantId))
    : fb.query(fb.collection(fb.db,'orders'));
  unsubs.push(fb.onSnapshot(ordersQ,snap=>{
    allOrders=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0));
    renderDash();renderOrders();
  }));
  const capsQ=isRest()
    ? fb.query(fb.collection(fb.db,'captains'),fb.where('restaurantId','==',currentUser.restaurantId))
    : fb.query(fb.collection(fb.db,'captains'));
  unsubs.push(fb.onSnapshot(capsQ,snap=>{
    allCaptains=snap.docs.map(d=>({id:d.id,...d.data()}));
    populateCapRestSelect();
  }));
  if(isAdmin()){
    unsubs.push(fb.onSnapshot(fb.collection(fb.db,'restaurants'),snap=>{
      allRestaurants=snap.docs.map(d=>({id:d.id,...d.data()}));
      renderRests();
      populateRestSelect();
    }));
  }
}

// DASHBOARD
function renderDash(){
  const orders=allOrders;
  const today=new Date();today.setHours(0,0,0,0);
  const todayOrders=orders.filter(o=>(o.createdAtMs||0)>=today.getTime());
  const active=orders.filter(o=>['pending','accepted','pickup','delivering'].includes(o.status));
  const delivered=orders.filter(o=>o.status==='delivered');
  const revenue=delivered.reduce((s,o)=>s+(o.value||0),0);
  const statsHTML=`
    <div class="stat"><div class="stat-v">${toA(orders.length)}</div><div class="stat-l">📦 الكل</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--yellow);">${toA(todayOrders.length)}</div><div class="stat-l">📅 اليوم</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--blue);">${toA(active.length)}</div><div class="stat-l">🔵 نشطة</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--green);">${toA(delivered.length)}</div><div class="stat-l">✅ مسلّمة</div></div>
    ${isAdmin()?`<div class="stat"><div class="stat-v" style="color:var(--purple);">${toA(allRestaurants.length)}</div><div class="stat-l">🍽️ مطاعم</div></div>`:''}
    <div class="stat"><div class="stat-v" style="color:var(--accent);">${toA(allCaptains.length)}</div><div class="stat-l">🛵 كباتن</div></div>
    <div class="stat"><div class="stat-v" style="font-size:16px;">${fmt(revenue)}</div><div class="stat-l">💰 إجمالي (د.ع)</div></div>
  `;
  document.getElementById('dashStats').innerHTML=statsHTML;
  // Last 5 orders
  const last5=allOrders.slice(0,5);
  document.getElementById('dashOrders').innerHTML=last5.length?last5.map(o=>orderCard(o)).join(''):'<div style="text-align:center;color:var(--muted);padding:20px;">لا توجد طلبات</div>';
}

// ORDERS
function orderCard(o){
  const type=o.orderType||'delivery';
  const typeBadge=type==='salon'?'<span class="badge b-salon">🪑 صالة</span>':type==='takeaway'?'<span class="badge b-takeaway">🥡 سفري</span>':'<span class="badge" style="background:rgba(77,171,247,.15);color:var(--blue)">🏍️ دلفري</span>';
  const stB={pending:'b-pending',accepted:'b-accepted',pickup:'b-accepted',delivering:'b-delivering',delivered:'b-delivered',cancelled:'b-cancelled'};
  const stL={pending:'🟡 ينتظر',accepted:'🔵 مقبول',pickup:'🟠 استلام',delivering:'🛵 توصيل',delivered:'✅ مسلّم',cancelled:'❌ ملغي'};
  return`<div class="order-row">
    <div class="order-head"><span class="order-id">${o.id.substring(0,6).toUpperCase()}</span><span class="order-time">${o.createdAt||''}</span></div>
    <div style="margin-bottom:6px;">${typeBadge} <span class="badge ${stB[o.status]||'b-pending'}">${stL[o.status]||o.status}</span></div>
    ${o.customer?`<div style="font-size:11px;color:var(--muted);">👤 ${o.customer} ${o.phone?'• 📞 '+o.phone:''}</div>`:''}
    ${o.address?`<div style="font-size:11px;color:var(--muted);">📍 ${o.address}</div>`:''}
    <div style="display:flex;justify-content:space-between;margin-top:6px;align-items:center;">
      <span style="font-size:12px;font-weight:700;color:var(--accent2);">💰 ${fmt(o.value)} د.ع${o.fee?' + '+fmt(o.fee)+' توصيل':''}</span>
      ${o.captainName?`<span style="font-size:11px;color:var(--muted);">🛵 ${o.captainName}</span>`:''}
      ${isAdmin()&&o.restaurantName?`<span style="font-size:11px;color:var(--muted);">🍽️ ${o.restaurantName}</span>`:''}
    </div>
  </div>`;
}

window.setOF=function(f,btn){
  orderFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderOrders();
};

function renderOrders(){
  let fil=allOrders;
  if(orderFilter==='delivery')fil=allOrders.filter(o=>!o.orderType||o.orderType==='delivery');
  else if(orderFilter==='salon')fil=allOrders.filter(o=>o.orderType==='salon');
  else if(orderFilter==='takeaway')fil=allOrders.filter(o=>o.orderType==='takeaway');
  else if(orderFilter==='pending')fil=allOrders.filter(o=>['pending','accepted','pickup','delivering'].includes(o.status));
  else if(orderFilter==='delivered')fil=allOrders.filter(o=>o.status==='delivered');
  document.getElementById('ordersList').innerHTML=fil.length?fil.map(o=>orderCard(o)).join(''):'<div style="text-align:center;color:var(--muted);padding:24px;">لا توجد طلبات</div>';
}

// CAPTAINS STATS
window.renderCapStats=function(){
  const from=document.getElementById('capFrom')?.value;
  const to=document.getElementById('capTo')?.value;
  const start=from?new Date(from+'T00:00:00').getTime():0;
  const end=to?new Date(to+'T00:00:00').getTime()+86400000:Infinity;
  const filtered=allOrders.filter(o=>{const t=o.createdAtMs||0;return t>=start&&t<end;});
  const capMap={};
  allCaptains.forEach(c=>{capMap[c.id]={name:c.name,phone:c.phone||'',count:0,delivered:0,total:0,fee:0};});
  filtered.forEach(o=>{
    if(!o.captainId)return;
    if(!capMap[o.captainId])capMap[o.captainId]={name:o.captainName||o.captainId,phone:'',count:0,delivered:0,total:0,fee:0};
    capMap[o.captainId].count++;
    capMap[o.captainId].total+=(o.value||0);
    capMap[o.captainId].fee+=(o.fee||0);
    if(o.status==='delivered')capMap[o.captainId].delivered++;
  });
  const caps=Object.entries(capMap).map(([id,c])=>({id,...c})).sort((a,b)=>b.delivered-a.delivered);
  const html=caps.length?caps.map(cap=>`
    <div class="cap-stat-card">
      <div class="cap-stat-head">
        <div class="cap-av">🏍️</div>
        <div style="flex:1">
          <div style="font-weight:900;font-size:14px;">${cap.name}</div>
          <div style="font-size:11px;color:var(--muted);">${cap.phone}</div>
        </div>
        ${isRest()?`<button class="btn-sm btn-del" onclick="deleteCaptain('${cap.id}')">🗑️ حذف</button>`:''}
      </div>
      <div class="cap-stats-g">
        <div class="cap-stat-item"><div class="cap-stat-v">${toA(cap.count)}</div><div class="cap-stat-l">طلبات</div></div>
        <div class="cap-stat-item"><div class="cap-stat-v" style="color:var(--green);">${toA(cap.delivered)}</div><div class="cap-stat-l">مسلّمة</div></div>
        <div class="cap-stat-item"><div class="cap-stat-v" style="font-size:13px;">${fmt(cap.total)}</div><div class="cap-stat-l">د.ع مبيعات</div></div>
        <div class="cap-stat-item"><div class="cap-stat-v" style="font-size:13px;">${fmt(cap.fee)}</div><div class="cap-stat-l">د.ع توصيل</div></div>
        <div class="cap-stat-item"><div class="cap-stat-v" style="color:var(--yellow);">${toA(cap.count-cap.delivered)}</div><div class="cap-stat-l">غير مكتملة</div></div>
        <div class="cap-stat-item"><div class="cap-stat-v">${cap.count?toA(Math.round(cap.delivered/cap.count*100))+'%':'—'}</div><div class="cap-stat-l">نسبة إنجاز</div></div>
      </div>
    </div>`).join(''):'<div style="text-align:center;color:var(--muted);padding:24px;">لا توجد بيانات</div>';
  document.getElementById('capStatsList').innerHTML=html;
};

// ADD CAPTAIN
function populateCapRestSelect(){
  const sel=document.getElementById('ncRest');
  if(!sel||isRest())return;
  sel.innerHTML='<option value="">-- اختر المطعم --</option>'+allRestaurants.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
}

window.addCaptain=async function(){
  const restId=isRest()?currentUser.restaurantId:document.getElementById('ncRest').value;
  const name=document.getElementById('ncName').value.trim();
  const phone=document.getElementById('ncPhone').value.trim();
  const email=document.getElementById('ncEmail').value.trim().toLowerCase();
  const pass=document.getElementById('ncPass').value;
  if(!restId||!name||!phone||!email||!pass){toast('⚠️ أدخل كل البيانات','warn');return;}
  try{
    // Create user in secondary app (no logout)
    const cred=await window._fb.createUserWithEmailAndPassword(window._fb.auth2,email,pass);
    await window._fb.setDoc(window._fb.doc(window._fb.db,'users',cred.user.uid),{email,role:'captain',name});
    await window._fb.addDoc(window._fb.collection(window._fb.db,'captains'),{
      restaurantId:restId,userId:cred.user.uid,name,phone,email,available:true,createdAt:new Date().toISOString()
    });
    await window._fb.signOut(window._fb.auth2);
    toast('✅ تم إضافة الكابتن: '+name);
    ['ncRest','ncName','ncPhone','ncEmail','ncPass'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  }catch(e){
    toast('❌ '+e.message,'error');
    console.error(e);
  }
};

window.deleteCaptain=async function(id){
  if(!confirm('حذف هذا الكابتن؟'))return;
  try{
    await window._fb.deleteDoc(window._fb.doc(window._fb.db,'captains',id));
    toast('🗑️ تم الحذف');
  }catch(e){toast('❌ '+e.message,'error');}
};

// RESTAURANTS
function renderRests(){
  if(!isAdmin())return;
  const list=document.getElementById('restList');
  if(!allRestaurants.length){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:24px;">لا توجد مطاعم</div>';return;}
  list.innerHTML=allRestaurants.map(r=>{
    const myCaps=allCaptains.filter(c=>c.restaurantId===r.id);
    const myOrders=allOrders.filter(o=>o.restaurantId===r.id);
    const delivered=myOrders.filter(o=>o.status==='delivered');
    return`<div class="entity">
      <div class="entity-head">
        <div class="entity-icon">🍽️</div>
        <div><div class="entity-name">${r.name}</div><div class="entity-sub">📍 ${r.area||'—'} • 📧 ${r.email||'—'}</div></div>
      </div>
      <div class="entity-meta">
        <div class="meta-item"><strong>${toA(myCaps.length)}</strong>كابتن</div>
        <div class="meta-item"><strong>${toA(myOrders.length)}</strong>طلب</div>
        <div class="meta-item"><strong>${toA(delivered.length)}</strong>مسلّمة</div>
        <div class="meta-item"><strong>${fmt(r.subscription||0)}</strong>د.ع/شهر</div>
      </div>
      <div class="entity-actions">
        <button class="btn-sm btn-edit" onclick="openEditRest('${r.id}')">✏️ تعديل</button>
        <button class="btn-sm btn-del" onclick="deleteRest('${r.id}','${r.name}')">🗑️ حذف</button>
      </div>
    </div>`;
  }).join('');
}

function populateRestSelect(){
  const sel=document.getElementById('ncRest');
  if(sel) sel.innerHTML='<option value="">-- اختر المطعم --</option>'+allRestaurants.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
}

// ADD RESTAURANT
window.addRestaurant=async function(){
  const name=document.getElementById('nrName').value.trim();
  const area=document.getElementById('nrArea').value.trim();
  const email=document.getElementById('nrEmail').value.trim().toLowerCase();
  const phone=document.getElementById('nrPhone').value.trim();
  const pass=document.getElementById('nrPass').value;
  const sub=parseInt(document.getElementById('nrSub').value)||50000;
  if(!name||!area||!email||!pass){toast('⚠️ أدخل الاسم والمنطقة والإيميل وكلمة المرور','warn');return;}
  if(pass.length<6){toast('⚠️ كلمة المرور 6 أحرف على الأقل','warn');return;}
  const btn=document.getElementById('addRestBtn');
  btn.innerHTML='<div class="spin"></div>';btn.disabled=true;
  try{
    // Create Firebase Auth user in secondary app
    const cred=await window._fb.createUserWithEmailAndPassword(window._fb.auth2,email,pass);
    const uid=cred.user.uid;
    // Add to users collection
    await window._fb.setDoc(window._fb.doc(window._fb.db,'users',uid),{email,role:'restaurant',name});
    // Add to restaurants collection
    await window._fb.addDoc(window._fb.collection(window._fb.db,'restaurants'),{
      name,area,email,phone,subscription:sub,userId:uid,
      createdAt:new Date().toISOString(),createdAtMs:Date.now()
    });
    // Sign out secondary
    await window._fb.signOut(window._fb.auth2);
    toast('✅ تم إضافة المطعم: '+name);
    ['nrName','nrArea','nrEmail','nrPhone','nrPass'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('nrSub').value='50000';
  }catch(e){
    if(e.code==='auth/email-already-in-use') toast('❌ هذا الإيميل مستخدم مسبقاً','error');
    else toast('❌ '+e.message,'error');
    console.error(e);
  }finally{btn.innerHTML='➕ إضافة المطعم';btn.disabled=false;}
};

// EDIT RESTAURANT
window.openEditRest=async function(id){
  const r=allRestaurants.find(x=>x.id===id);
  if(!r)return;
  document.getElementById('erId').value=id;
  document.getElementById('erName').value=r.name||'';
  document.getElementById('erArea').value=r.area||'';
  document.getElementById('erEmail').value=r.email||'';
  document.getElementById('erPhone').value=r.phone||'';
  document.getElementById('erSub').value=r.subscription||50000;
  document.getElementById('erPass').value='';
  document.getElementById('editRestMo').classList.add('open');
};

window.saveRest=async function(){
  const id=document.getElementById('erId').value;
  const name=document.getElementById('erName').value.trim();
  const area=document.getElementById('erArea').value.trim();
  const email=document.getElementById('erEmail').value.trim().toLowerCase();
  const phone=document.getElementById('erPhone').value.trim();
  const sub=parseInt(document.getElementById('erSub').value)||50000;
  const pass=document.getElementById('erPass').value;
  if(!name||!email){toast('⚠️ أدخل الاسم والإيميل','warn');return;}
  try{
    // Update restaurants doc
    await window._fb.updateDoc(window._fb.doc(window._fb.db,'restaurants',id),{name,area,email,phone,subscription:sub});
    // Update users doc if userId exists
    const restDoc=await window._fb.getDoc(window._fb.doc(window._fb.db,'restaurants',id));
    if(restDoc.exists()&&restDoc.data().userId){
      await window._fb.updateDoc(window._fb.doc(window._fb.db,'users',restDoc.data().userId),{email,name}).catch(()=>{});
    }
    if(pass&&pass.length>=6){
      toast('✅ تم التحديث! لتغيير كلمة المرور يجب من Firebase Console','warn');
    }else{
      toast('✅ تم تحديث بيانات المطعم!');
    }
    document.getElementById('editRestMo').classList.remove('open');
  }catch(e){toast('❌ '+e.message,'error');}
};

window.deleteRest=async function(id,name){
  if(!confirm(`⚠️ حذف مطعم "${name}" وكل بياناته؟`))return;
  try{
    // Delete captains
    const caps=await window._fb.getDocs(window._fb.query(window._fb.collection(window._fb.db,'captains'),window._fb.where('restaurantId','==',id)));
    await Promise.all(caps.docs.map(d=>window._fb.deleteDoc(d.ref)));
    await window._fb.deleteDoc(window._fb.doc(window._fb.db,'restaurants',id));
    toast('🗑️ تم حذف المطعم');
  }catch(e){toast('❌ '+e.message,'error');}
};

// ANALYTICS
window.renderAnalytics=function(){
  const from=document.getElementById('anFrom')?.value;
  const to=document.getElementById('anTo')?.value;
  const start=from?new Date(from+'T00:00:00').getTime():0;
  const end=to?new Date(to+'T00:00:00').getTime()+86400000:Infinity;
  const fil=allOrders.filter(o=>{const t=o.createdAtMs||0;return t>=start&&t<end;});
  const delivered=fil.filter(o=>o.status==='delivered');
  const total=fil.reduce((s,o)=>s+(o.value||0),0);
  const fees=fil.reduce((s,o)=>s+(o.fee||0),0);
  const deliveryCount=fil.filter(o=>!o.orderType||o.orderType==='delivery').length;
  const salonCount=fil.filter(o=>o.orderType==='salon').length;
  const takeCount=fil.filter(o=>o.orderType==='takeaway').length;
  let restStats='';
  if(isAdmin()){
    const restMap={};
    fil.forEach(o=>{
      if(!o.restaurantId)return;
      if(!restMap[o.restaurantId])restMap[o.restaurantId]={name:o.restaurantName||o.restaurantId,count:0,total:0};
      restMap[o.restaurantId].count++;restMap[o.restaurantId].total+=(o.value||0);
    });
    restStats=`<div class="card"><div class="card-title"><span class="dot"></span> تفاصيل المطاعم</div>`+
      Object.values(restMap).sort((a,b)=>b.total-a.total).map(r=>`
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;">
          <span>🍽️ ${r.name}</span>
          <span style="color:var(--accent2);font-weight:700;">${toA(r.count)} طلب — ${fmt(r.total)} د.ع</span>
        </div>`).join('')+'</div>';
  }
  document.getElementById('analyticsContent').innerHTML=`
    <div class="stats" style="grid-template-columns:repeat(2,1fr);">
      <div class="stat"><div class="stat-v">${toA(fil.length)}</div><div class="stat-l">📦 إجمالي الطلبات</div></div>
      <div class="stat"><div class="stat-v" style="color:var(--green);">${toA(delivered.length)}</div><div class="stat-l">✅ مسلّمة</div></div>
      <div class="stat"><div class="stat-v" style="color:var(--blue);">${toA(deliveryCount)}</div><div class="stat-l">🏍️ دلفري</div></div>
      <div class="stat"><div class="stat-v" style="color:var(--purple);">${toA(salonCount)}</div><div class="stat-l">🪑 صالة</div></div>
      <div class="stat"><div class="stat-v" style="color:var(--yellow);">${toA(takeCount)}</div><div class="stat-l">🥡 سفري</div></div>
      <div class="stat"><div class="stat-v" style="font-size:14px;">${fmt(total)}</div><div class="stat-l">💰 المبيعات (د.ع)</div></div>
      <div class="stat"><div class="stat-v" style="font-size:14px;color:var(--accent);">${fmt(fees)}</div><div class="stat-l">🚗 التوصيل (د.ع)</div></div>
      <div class="stat"><div class="stat-v" style="font-size:14px;">${fil.length?fmt(Math.round(total/fil.length)):0}</div><div class="stat-l">⌀ متوسط الطلب</div></div>
    </div>
    ${restStats}`;
};

// MODAL
window.closeMo=id=>document.getElementById(id).classList.remove('open');
document.addEventListener('click',e=>{
  document.querySelectorAll('.modal-ov.open').forEach(mo=>{if(e.target===mo)mo.classList.remove('open');});

// ── MAP ──
let mapInitialized = false;
let mapInstance = null;
let capMarkers = {};

function initMap(){
  if(!mapInitialized){
    // Load Leaflet
    const css=document.createElement('link');
    css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const sc=document.createElement('script');
    sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    sc.onload=()=>{
      mapInitialized=true;
      mapInstance=L.map('mapContainer').setView([33.3152,44.3661],12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap',maxZoom:18
      }).addTo(mapInstance);
      renderMapCaptains();
    };
    document.head.appendChild(sc);
  }else{
    renderMapCaptains();
    if(mapInstance) setTimeout(()=>mapInstance.invalidateSize(),100);
  }
}

async function renderMapCaptains(){
  if(!mapInstance)return;
  const fb=window._fb;
  try{
    const locsQ=isRest()
      ? fb.query(fb.collection(fb.db,'captainLocations'),fb.where('restaurantId','==',currentUser.restaurantId))
      : fb.query(fb.collection(fb.db,'captainLocations'));
    const snap=await fb.getDocs(locsQ);
    const now=Date.now();
    const capLocHTML=[];
    // Clear old markers
    Object.values(capMarkers).forEach(m=>mapInstance.removeLayer(m));
    capMarkers={};
    snap.docs.forEach(d=>{
      const data=d.data();
      const isOnline=(now-(data.timestamp||0))<120000; // 2 min
      const cap=allCaptains.find(c=>c.id===data.captainId);
      const name=data.captainName||cap?.name||data.captainId;
      if(!data.lat||!data.lng)return;
      // Add marker
      const icon=L.divIcon({
        html:`<div style="background:${isOnline?'#2ecc71':'#ff4757'};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.3);">🏍️</div>`,
        className:'',iconSize:[36,36],iconAnchor:[18,18]
      });
      const marker=L.marker([data.lat,data.lng],{icon}).addTo(mapInstance);
      marker.bindPopup(`<div style="font-family:Tajawal,sans-serif;text-align:center;direction:rtl;">
        <strong>${name}</strong><br>
        <span style="color:${isOnline?'green':'red'}">${isOnline?'🟢 متصل':'🔴 غير متصل'}</span>
      </div>`);
      capMarkers[data.captainId]=marker;
      capLocHTML.push(`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);">
        <div style="width:10px;height:10px;border-radius:50%;background:${isOnline?'var(--green)':'var(--red)'};flex-shrink:0;"></div>
        <div style="flex:1;font-size:12px;font-weight:700;">${name}</div>
        <div style="font-size:10px;color:var(--muted);">${isOnline?'متصل':'غير متصل'}</div>
      </div>`);
    });
    document.getElementById('capLocList').innerHTML=capLocHTML.length?capLocHTML.join(''):'<div style="text-align:center;color:var(--muted);padding:16px;">لا توجد مواقع متاحة</div>';
  }catch(e){console.error(e);}
}
